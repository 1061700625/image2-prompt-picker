<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GPT Image2 Prompts Side Panel</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="sidepanel">
  <header class="header">
    <div>
      <h1>GPT Image2 Prompts</h1>
      <p>快速浏览和使用 GPT Image 2 图片生成提示词</p>
    </div>
  </header>

  <section class="toolbar">
    <label class="field">
      <select id="langSelect" aria-label="语言" title="语言"></select>
    </label>

    <button id="checkBtn" type="button">检查更新</button>
    <button id="clearCacheBtn" type="button">清空缓存</button>
    <button id="syncBtn" type="button" class="primary">同步</button>
  </section>

  <div class="filter-row">
    <label class="field category-field">
      <select id="categorySelect" aria-label="分类" title="分类">
        <option value="">全部分类</option>
      </select>
    </label>

    <label class="field search-field">
      <input id="searchInput" class="search" aria-label="搜索" title="搜索" placeholder="标题、分类、Case 编号或 Prompt" />
    </label>
  </div>

  <div id="updateBanner" class="banner" hidden>
    发现远端有更新，点击“同步”即可更新本地缓存。
  </div>

  <div id="status" class="status">正在加载...</div>

  <div class="source-note">
    <div class="source-line">作者：<a id="authorLink" href="https://github.com/1061700625/image2-prompt-picker" target="_blank" rel="noreferrer">小锋学长生活大爆炸</a></div>
    <div class="source-line">数据来源：<a href="https://github.com/EvoLinkAI/awesome-gpt-image-2-API-and-Prompts" target="_blank" rel="noreferrer">EvoLinkAI/awesome-gpt-image-2-API-and-Prompts</a></div>
  </div>

  <main id="promptList" class="list"></main>

  <footer class="pager">
    <button id="prevPageBtn" type="button">上一页</button>
    <span id="pageInfo">第 1 / 1 页</span>
    <button id="nextPageBtn" type="button">下一页</button>
  </footer>

  <div id="hoverPreview" class="hover-preview" hidden aria-hidden="true">
    <div id="hoverPreviewSpinner" class="spinner" hidden></div>
    <img id="hoverPreviewImage" alt="Prompt output preview" hidden />
  </div>

  <script src="popup.js"></script>
</body>
</html>
